services:
  db:
    image: postgres:15
    container_name: meu_postgres
    restart: always
    environment:
      # Aqui acontece a "mágica": o Docker Compose lê o .env automaticamente
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

      # 2. Onde estão os seus scripts SQL (schema e dados)
      - ./app/sql:/docker-entrypoint-initdb.d
volumes:
  pgdata: